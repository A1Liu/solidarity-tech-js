defaultTs: bun
includes:
  - f/canvass_map/**
  - f/canvass_admin/**
excludes: []

skipVariables: true
skipResources: true
skipResourceTypes: true
skipSecrets: true
skipFolders: true

includeSchedules: false
includeTriggers: false
includeUsers: false
includeGroups: false
includeSettings: false
includeKey: false

skipBranchValidation: true
nonDottedPaths: true
syncBehavior: v1

workspaces:
  dev:
    baseUrl: https://windmill.socialists.nyc/
    workspaceId: wm-fork-develop
  prod:
    baseUrl: https://windmill.socialists.nyc/
    workspaceId: main
