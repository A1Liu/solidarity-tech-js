                excludeTags: []
                iframeStyles: null
                includeTitleSubstrings: []
                requireTags: []
        path: f/canvass_map/fetch_all_campaign_events
      continue_on_error: false
    - id: b
      summary: Add TTR as Campaign if in Title
      value:
        type: rawscript
        content: '!inline add_ttr_as_campaign_if_in_title.ts'
        input_transforms:
          allEvents:
            type: javascript
            expr: results.a
        lock: '!inline add_ttr_as_campaign_if_in_title.lock'
        language: bun
has_on_behalf_of: false
