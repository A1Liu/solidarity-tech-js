                cantComeLink: https://illapa.nyc/
                cantComeText: Can't Make These? Sign Up to Volunteer with Illapa's Campaign
                titleRegexFilter: ''
          solidarityTechCampaigns:
            type: static
            value:
              - apiKey: f/canvass_map/our_time_api_key
                campaignName: Tax the Rich
                cantComeLink: https://act.ourtime.nyc/phonebank-for-childcare-and-tax-the-rich?utm_source=mapfallback
                cantComeText: Can't Canvass? Join Our Tuesday Phonebank!
                excludeTags:
                  - exclude-dsa
                iframeStyles:
